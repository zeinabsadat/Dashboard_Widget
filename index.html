<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment:    #f9f6f2;
    --eggshell:     #f0ead6;
    --floral-white: #fff9f0;
    --soft-linen:   #eae3d6;
    --warm-brown:   #7a6248;
    --deep-brown:   #3a2a1a;
    --mid-tone:     #c8b89a;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    background: transparent;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  /* Wrapper: shrinks to the scaled height */
  #scaleWrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
  }

  /* ===== MAIN CARD — 640px natural width ===== */
  /* 640 - 24(padding) - 200 - 10(gap) - 200 - 10(gap) = 196px for quotes */
  .main-card {
    width: 640px;
    flex-shrink: 0;
    background: var(--soft-linen);
    border-radius: 32px;
    padding: 12px;
    transform-origin: top center;
    box-shadow:
      0 16px 48px rgba(122, 98, 72, 0.16),
      0 4px 12px rgba(0, 0, 0, 0.06);
  }

  /* ===== SINGLE HORIZONTAL ROW ===== */
  .row {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  /* ===== SHARED CARD BASE ===== */
  .card {
    background: var(--floral-white);
    border-radius: 24px;
    box-shadow:
      0 6px 20px rgba(122, 98, 72, 0.10),
      0 2px 5px rgba(0, 0, 0, 0.04),
      inset 0 0 0 1px rgba(122, 98, 72, 0.07);
    overflow: hidden;
  }

  /* ===== CLOCK — 200×200 ===== */
  .clock-card {
    width: 200px;
    height: 200px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .clock {
    width: 154px;
    height: 154px;
    position: relative;
  }
  .tick {
    position: absolute;
    left: 50%;
    top: 5px;
    width: 2px;
    height: 6px;
    background: var(--mid-tone);
    border-radius: 1px;
    transform-origin: 50% 72px; /* radius(77) - tickTop(5) */
  }
  .hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    transform-origin: 50% 100%;
    border-radius: 4px;
  }
  .hour   { width: 5px;   height: 42px; background: var(--deep-brown); margin-left: -2.5px; }
  .minute { width: 4px;   height: 58px; background: var(--deep-brown); margin-left: -2px; }
  .second { width: 2px;   height: 65px; background: var(--warm-brown); margin-left: -1px;
            transition: transform 0.1s cubic-bezier(0.4, 2.3, 0.6, 1); }
  .clock-center {
    position: absolute;
    left: 50%; top: 50%;
    width: 9px; height: 9px;
    background: var(--warm-brown);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 1.5px var(--floral-white), 0 1px 2px rgba(0,0,0,0.15);
    z-index: 5;
  }

  /* ===== GALLERY — 200×200 ===== */
  .photo-card {
    width: 200px;
    height: 200px;
    flex-shrink: 0;
    padding: 10px;
  }
  .photo-frame {
    width: 100%; height: 100%;
    border-radius: 16px;
    overflow: hidden;
    background: var(--eggshell);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slide {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 1.2s ease-in-out, transform 30s ease-out;
    transform: scale(1);
  }
  .slide.active { opacity: 1; transform: scale(1.08); }
  .loading {
    width: 20px; height: 20px;
    border: 2px solid var(--soft-linen);
    border-top-color: var(--warm-brown);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== QUOTES — fills remaining space, same height ===== */
  .quote-card {
    flex: 1;
    min-width: 0;
    padding: 10px;
    display: flex;
    flex-direction: column;
  }
  .quote-inner {
    flex: 1;
    background: var(--eggshell);
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .quote-inner::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(249,246,242,0.55) 0%, transparent 55%);
    pointer-events: none;
  }
  .quote-mark {
    position: absolute;
    top: -4px; left: 12px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 64px;
    line-height: 1;
    color: var(--warm-brown);
    opacity: 0.2;
    pointer-events: none;
    user-select: none;
  }
  .quote-slide {
    position: absolute; inset: 0;
    padding: 20px 18px 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    opacity: 0;
    transition: opacity 1s ease-in-out, transform 1s ease-in-out;
    transform: translateY(6px);
  }
  .quote-slide.active { opacity: 1; transform: translateY(0); }
  .quote-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.5;
    color: var(--deep-brown);
    margin: 0 0 10px 0;
  }
  .quote-text.sm { font-size: 14px; }
  .quote-text.xs { font-size: 13px; }
  .divider {
    width: 22px; height: 1.5px;
    background: var(--mid-tone);
    border-radius: 1px;
    margin-bottom: 8px;
  }
  .quote-author {
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 500;
    color: var(--warm-brown);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div id="scaleWrapper">
  <div class="main-card" id="mainCard">
    <div class="row">

      <!-- Clock: 200×200 -->
      <div class="card clock-card">
        <div class="clock" id="clock">
          <div class="hand hour"   id="hourHand"></div>
          <div class="hand minute" id="minuteHand"></div>
          <div class="hand second" id="secondHand"></div>
          <div class="clock-center"></div>
        </div>
      </div>

      <!-- Gallery: 200×200 -->
      <div class="card photo-card">
        <div class="photo-frame" id="frame">
          <div class="loading" id="loading"></div>
        </div>
      </div>

      <!-- Quotes: fills the rest -->
      <div class="card quote-card">
        <div class="quote-inner">
          <div class="quote-mark">"</div>
          <div id="quoteContainer"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
/* ==================== SCALE ==================== */
(function() {
  const NATURAL_W = 640;
  const wrapper   = document.getElementById('scaleWrapper');
  const card      = document.getElementById('mainCard');

  function scaleWidget() {
    const scale = Math.min(1, window.innerWidth / NATURAL_W);
    card.style.transform = `scale(${scale})`;
    wrapper.style.height = Math.round(card.offsetHeight * scale) + 'px';
  }
  scaleWidget();
  window.addEventListener('resize', scaleWidget);
})();

/* ==================== CLOCK ==================== */
(function() {
  const clockEl  = document.getElementById('clock');
  const hourHand = document.getElementById('hourHand');
  const minHand  = document.getElementById('minuteHand');
  const secHand  = document.getElementById('secondHand');

  for (let i = 0; i < 12; i++) {
    const tick = document.createElement('div');
    tick.className = 'tick';
    tick.style.transform = `translateX(-50%) rotate(${i * 30}deg)`;
    clockEl.appendChild(tick);
  }

  function updateClock() {
    const now = new Date();
    const h  = now.getHours() % 12;
    const m  = now.getMinutes();
    const s  = now.getSeconds();
    const ms = now.getMilliseconds();
    hourHand.style.transform = `rotate(${(h + m / 60) * 30}deg)`;
    minHand.style.transform  = `rotate(${(m + s / 60) * 6}deg)`;
    secHand.style.transform  = `rotate(${(s + ms / 1000) * 6}deg)`;
  }
  updateClock();
  setInterval(updateClock, 1000);
})();

/* ==================== GALLERY ==================== */
(function() {
  const GITHUB_USER   = "zeinabsadat";
  const GITHUB_REPO   = "Gallery";
  const GITHUB_BRANCH = "main";
  const INTERVAL_MS   = 30000;
  const imageRegex    = /\.(jpg|jpeg|png|gif|webp|avif)$/i;
  const frame         = document.getElementById('frame');
  const loading       = document.getElementById('loading');

  async function loadImages() {
    try {
      const res    = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/?ref=${GITHUB_BRANCH}`);
      const files  = await res.json();
      const images = files
        .filter(f => f.type === 'file' && imageRegex.test(f.name))
        .map(f => f.download_url);
      if (!images.length) { loading.style.display = 'none'; return; }
      images.sort(() => Math.random() - 0.5);
      startSlideshow(images);
    } catch(e) { loading.style.display = 'none'; }
  }

  function startSlideshow(images) {
    loading.style.display = 'none';
    const slides = images.map(src => {
      const div = document.createElement('div');
      div.className = 'slide';
      div.style.backgroundImage = `url("${src}")`;
      frame.appendChild(div);
      new Image().src = src;
      return div;
    });
    let cur = 0;
    slides[0].classList.add('active');
    if (slides.length < 2) return;
    setInterval(() => {
      const prev = cur;
      cur = (cur + 1) % slides.length;
      slides[cur].classList.add('active');
      setTimeout(() => slides[prev].classList.remove('active'), 1200);
    }, INTERVAL_MS);
  }

  loadImages();
})();

/* ==================== QUOTES ==================== */
(function() {
  const quotes = [
    { text: "Be yourself; everyone else is already taken.", author: "Oscar Wilde" },
    { text: "In the end, it's not the years in your life that count. It's the life in your years.", author: "Abraham Lincoln" },
    { text: "The darkest hour has only sixty minutes.", author: "Morris West" },
    { text: "Our greatest glory is not in never falling, but in rising every time we fall.", author: "Confucius" },
    { text: "The only thing necessary for the triumph of evil is for good men to do nothing.", author: "Edmund Burke" },
    { text: "We become what we think about.", author: "Earl Nightingale" },
    { text: "A journey of a thousand miles begins with a single step.", author: "Lao Tzu" },
    { text: "Life is really simple, but we insist on making it complicated.", author: "Confucius" },
    { text: "Your limits exist only in your mind.", author: "Inspirational Proverb" },
    { text: "The best way to predict the future is to create it.", author: "Peter Drucker" }
  ];

  const container = document.getElementById('quoteContainer');
  quotes.sort(() => Math.random() - 0.5);

  const slides = quotes.map(q => {
    const slide = document.createElement('div');
    slide.className = 'quote-slide';
    const cls = q.text.length > 100 ? 'xs' : q.text.length > 70 ? 'sm' : '';
    slide.innerHTML = `
      <p class="quote-text ${cls}">${q.text}</p>
      <div class="divider"></div>
      <p class="quote-author">${q.author}</p>
    `;
    container.appendChild(slide);
    return slide;
  });

  let cur = 0;
  slides[0].classList.add('active');
  if (slides.length > 1) {
    setInterval(() => {
      slides[cur].classList.remove('active');
      cur = (cur + 1) % slides.length;
      setTimeout(() => slides[cur].classList.add('active'), 400);
    }, 15000);
  }
})();
</script>
</body>
</html>
